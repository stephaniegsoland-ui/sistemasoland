services:
  - type: web
    name: soland-api
    env: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: soland-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DB_URL
        sync: false
      - key: USE_SQLITE_FALLBACK
        value: "false"
      - key: APP_ENV
        value: production
      - key: SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN
        value: "false"
      - key: MEDIA_ROOT
        value: /var/data
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: CORS_ALLOWED_ORIGINS
        value: https://soland.com,https://www.soland.com
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
